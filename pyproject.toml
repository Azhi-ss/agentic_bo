[project]
name = "boagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "botorch>=0.18.1",
    "gpytorch>=1.15.2",
    "numpy>=2.0",
    "openai>=2.53.0",
    "pandas>=2.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.2",
    "typer>=0.12",
]

[project.scripts]
lenz = "boagent.cli:app"
boagent = "boagent.agent_cli:app"
boagent-oracle = "boagent.oracle:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
